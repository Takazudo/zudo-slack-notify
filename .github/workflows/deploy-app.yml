name: Deploy app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/actions/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  # `secrets.*` cannot be used in `if:`, so map them to env and expose a flag.
  # Missing credentials skip the deploy cleanly (green) instead of failing it.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::notice::Deploys run from main only (ref: $REF); skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare credentials are not configured; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm --filter zudo-slack-notify-app typecheck
      - name: Unit tests
        run: pnpm --filter zudo-slack-notify-app test
      - name: Workerd tests
        run: pnpm --filter zudo-slack-notify-app test:workerd

  deploy:
    needs: [gate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      # Cloudflare credentials are scoped to this step only. Worker runtime
      # secrets are never set by CI (see `pnpm ops:push-secrets`).
      - name: Deploy Worker
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Smoke-test the deployed Worker
        env:
          # Forks: set the APP_BASE_URL repo variable to your deployed API origin.
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          # Set the repo variable to "true" once Slack is wired; it retires the
          # 503 server_misconfigured bootstrap tolerance.
          SLACK_WIRED: ${{ vars.SLACK_WIRED }}
        run: bash scripts/smoke.sh app
