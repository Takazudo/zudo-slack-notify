name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      - name: Format check
        run: pnpm format:check
      - name: Markdown format check
        run: pnpm format:md:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck

  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      - name: App unit tests
        run: pnpm --filter zudo-slack-notify-app test
      # Root `pnpm test` does not run the workerd suite; it needs its own step.
      - name: App workerd tests
        run: pnpm --filter zudo-slack-notify-app test:workerd

  test-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      - name: Ops and smoke script tests
        run: pnpm test:ops

  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      - name: Build app (wrangler deploy --dry-run)
        run: pnpm --filter zudo-slack-notify-app build

  build-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup
      - name: Build doc
        run: pnpm --filter zudo-slack-notify-doc build
      - name: Check links
        run: pnpm --filter zudo-slack-notify-doc check:links
