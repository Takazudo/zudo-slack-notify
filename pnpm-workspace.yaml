packages:
  - "app"
  - "doc"

# pnpm only reads workspace settings at the workspace root, so the zudo-doc
# scaffold's settings for doc/ live here.
# pnpm 11 defaults minimumReleaseAge to 1440min; the exclude matcher can't match
# a fresh install's peer-nested lockfile keys (upstream pnpm bug), so the gate
# is disabled outright, the same as the zudo-doc scaffold does.
minimumReleaseAge: 0

# Native-binary packages are the only install scripts allowed to run.
allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true
